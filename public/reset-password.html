<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer contraseña</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      background:#f4f7fb; 
      display:flex; 
      justify-content:center; 
      align-items:center; 
      height:100vh; 
    }
    .container { 
      background:#fff; 
      padding:30px; 
      border-radius:12px; 
      box-shadow:0 4px 10px rgba(0,0,0,0.1); 
      max-width:400px; 
      width:100%; 
      text-align:center;
    }
    .header {
      background-color: #b89a59;
      color: white;
      padding: 15px 0;
      border-radius: 12px 12px 0 0;
      margin: -30px -30px 20px -30px;
      font-size: 20px;
      font-weight: bold;
    }
    input, button { 
      width:100%; 
      padding:12px; 
      margin:10px 0; 
      border-radius:8px; 
      border:1px solid #ddd; 
    }
    button { 
      background:#b89a59; 
      color:#fff; 
      border:none; 
      font-weight:bold; 
      cursor:pointer; 
    }
    button:hover { 
      background:#a4874d; 
    }
    #successMsg { 
      display:none; 
      color:green; 
      text-align:center;
      margin-top:10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">Bienvenido a Cafetería Galileo</div>
    <h2>Restablecer contraseña</h2>
    <p>Por favor ingresa tu nueva contraseña para completar el proceso de recuperación.</p>
    <form id="resetForm">
      <input type="password" id="newPassword" placeholder="Nueva contraseña" required>
      <button type="submit">Actualizar contraseña</button>
    </form>
    <p id="successMsg">Contraseña actualizada con éxito</p>
  </div>

  <script>
    // Tomar token del query string
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    const form = document.getElementById('resetForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;

      try {
        const res = await fetch(`http://localhost:3000/api/v1/auth/reset-password/${token}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ newPassword }),
        });

        if (res.ok) {
          document.getElementById('successMsg').style.display = 'block';
          form.reset();
        } else {
          const data = await res.json();
          alert(data.message || 'Error al actualizar la contraseña. El enlace puede haber expirado.');
        }
      } catch (err) {
        alert('Error al conectar con el servidor.');
        console.error(err);
      }
    });
  </script>
</body>
</html>
