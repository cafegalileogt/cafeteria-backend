<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cuenta activada</title>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f9f9f9;
        margin: 0;
        padding: 0;
      }
      .container {
        max-width: 500px;
        margin: 80px auto;
        background-color: #ffffff;
        border-radius: 14px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
        text-align: center;
        overflow: hidden;
      }
      .header {
        background-color: #b89a59;
        padding: 25px 20px;
      }
      .header h1 {
        color: #ffffff;
        margin: 0;
        font-size: 24px;
      }
      .content {
        padding: 40px 30px;
      }
      .content h2 {
        color: #b89a59;
        font-size: 22px;
        margin-bottom: 10px;
      }
      .content p {
        color: #555;
        font-size: 15px;
        margin-bottom: 25px;
      }
      .btn {
        display: inline-block;
        padding: 12px 24px;
        background-color: #b89a59;
        color: #fff;
        text-decoration: none;
        border-radius: 8px;
        font-weight: bold;
        transition: background-color 0.25s ease-in-out;
      }
      .btn:hover {
        background-color: #a4874d;
      }
      .footer {
        background-color: #f3f3f3;
        color: #777;
        font-size: 13px;
        padding: 20px;
      }
      .icon {
        font-size: 50px;
        color: #b89a59;
        margin-bottom: 15px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Cafetería Galileo</h1>
      </div>
      <div class="content">
        <div class="icon">✅</div>
        <h2>¡Cuenta activada con éxito!</h2>
        <p>
          Tu cuenta ha sido verificada correctamente.  
          Ya puedes iniciar sesión y disfrutar de nuestros servicios.
        </p>
      </div>
      <div class="footer">
        © 2025 Cafetería Galileo. Todos los derechos reservados.
      </div>
    </div>
  </body>
</html>
